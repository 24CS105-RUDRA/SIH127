version: '3.8'

services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: anpr-postgres
    environment:
      POSTGRES_DB: anpr_db
      POSTGRES_USER: anpr_user
      POSTGRES_PASSWORD: anpr_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anpr_user -d anpr_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: anpr-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: anpr-backend
    environment:
      DATABASE_URL: postgresql+asyncpg://anpr_user:anpr_pass@postgres:5432/anpr_db
      REDIS_URL: redis://redis:6379
      ML_SERVICE_URL: http://ml-service:8001
      SECRET_KEY: your-secret-key-change-in-production
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ml-service:
        condition: service_started
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: anpr-ml-service
    environment:
      PYTHONUNBUFFERED: 1
    ports:
      - "8001:8001"
    volumes:
      - ./ml-service:/app
      - ./ml-service/weights:/app/weights
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: anpr-frontend
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://localhost:8000
      VITE_WS_URL: ws://localhost:8000
      VITE_MAPBOX_TOKEN: your-mapbox-token
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0

  simulator:
    build:
      context: ./simulator
      dockerfile: Dockerfile
    container_name: anpr-simulator
    environment:
      BACKEND_URL: http://backend:8000
      SIMULATION_SPEED: 10
      CAMERA_COUNT: 12
    depends_on:
      - backend
    volumes:
      - ./simulator:/app
      - ./seed:/app/seed
    command: python simulate_traffic.py

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: anpr-network